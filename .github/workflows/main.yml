name: Teklif Analizi

on:
  push:
    paths:
      - 'Teklifler/**'
      - 'AnalizKodu.py'

  workflow_dispatch:

jobs:
  analiz:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri yükle
        run: |
          pip install -r requirements.txt

      - name: Analizi çalıştır
        run: |
          python AnalizKodu.py

      - name: Sonuçları kaydet
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add .

          git diff --cached --quiet || git commit -m "Otomatik analiz güncellendi"

          git push
