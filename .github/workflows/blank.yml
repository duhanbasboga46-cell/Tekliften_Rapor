name: Sales Analysis

on:
  push:
    paths:
      - 'data/*.csv'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Kur
        run: |
          pip install pandas matplotlib

      - name: Analizi Çalıştır
        run: |
          python analyzer.py

      - name: Sonuçları Commit Et
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add charts/
          git add reports/

          git commit -m "Otomatik analiz güncellemesi" || exit 0
          git push
